name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # SSH-Zugang bei Hetzner Webhosting nur per Schlüssel auf Port 222.
      # Dort ist man nicht im chroot, daher der absolute Pfad zum Document Root.
      - name: Deploy via SFTP (lftp mirror, SSH key)
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "cydw6y," sftp://www754.your-server.de:222 -e "
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes';
            set net:max-retries 2;
            set net:timeout 15;
            mirror -R --only-newer --no-perms --parallel=2 \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.claude/' \
              --exclude '^\.gitignore$' \
              --exclude '^deploy-secrets/' \
              --exclude '^LEARNINGS\.md$' \
              ./ /usr/www/users/cydw6y/;
            bye
          "
          rm -f ~/.ssh/deploy_key
