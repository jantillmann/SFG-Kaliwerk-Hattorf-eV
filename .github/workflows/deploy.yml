name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" sftp://$FTP_SERVER:22 -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 15;
            mirror -R --only-newer --no-perms --parallel=2 \
              --exclude-glob .git* \
              --exclude .github/ \
              ./ /public_html/;
            bye
          "
